services:
  - type: web
    name: restaurant-finder-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_PLACES_API_KEY
        sync: false          # you paste it in the Render dashboard, never in git
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel URL, e.g. https://restaurant-finder.vercel.app
